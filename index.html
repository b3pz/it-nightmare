<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>IT NIGHTMARE — ARCHEA // After Hours</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div><b id="clock">09:00</b><small>TIME</small></div>
    <div><b id="stress">0%</b><small>STRESS</small></div>
    <div><b id="rep">★★★★☆</b><small>REPUTAZIONE</small></div>
    <div><b id="open">0</b><small>TICKET</small></div>
    <div><b id="xp">0</b><small>XP</small></div>
    <div><b id="incident">0%</b><small>INCIDENT</small></div>
  </header>
  <main>
    <canvas id="game" width="1536" height="864"></canvas>
    <aside id="ticketPanel"><h3>ACTIVE TICKET</h3><div id="ticketText">Nessun ticket aperto.</div></aside>
    <div id="toast"></div>
    <div id="mobile">
      <div id="joy"><i></i></div>
      <button id="act">E<span>INTERAGISCI</span></button>
    </div>
  </main>
  <footer>WASD / FRECCE — MUOVITI &nbsp;&nbsp; E — INTERAGISCI &nbsp;&nbsp; Completa le task prima che INCIDENT LEVEL raggiunga 100%</footer>
</div>
<div id="modal" class="hidden"><section><button id="x">×</button><div id="modalBody"></div></section></div>
<script src="game.js"></script>
</body></html>
